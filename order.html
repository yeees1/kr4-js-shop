<main id="main">
    <section class="section"><h1>Оставить заявку</h1>
        <p>Выберите товар и укажите контактные данные. Это демонстрация: заявка не отправляется на сервер.</p>
        <form id="order-form" class="order-form order-form--page" novalidate>
            <div class="form-field"><label for="order-product">Товар</label><select id="order-product" required>
                <option value="">Выберите товар</option>
                <optgroup label="Другие товары из КР №3">
                    <option>Футболка «Славянский интерфейс»</option>
                    <option>Футболка Balance</option>
                    <option>Металлический кардхолдер</option>
                    <option>Ремешок для телефона</option>
                    <option>Кружка Grade Fade</option>
                    <option>Выдвижной кабель 3 в 1</option>
                    <option>Коврик с подсказками по 1С</option>
                    <option>Ручка-мультитул 1С</option>
                    <option>Моя спящая Элла</option>
                    <option>Моя уставшая защитница Элла</option>
                    <option>Моя защитница Элла</option>
                </optgroup>
            </select></div>
            <div class="form-field"><label for="order-name">Имя</label><input id="order-name" type="text" minlength="2"
                                                                              autocomplete="given-name" required></div>
            <div class="form-field"><label for="order-email">E-mail</label><input id="order-email" type="email"
                                                                                  autocomplete="email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Введите адрес вида name@example.com" required></div>
            <div class="form-field"><label for="order-phone">Телефон</label><input id="order-phone" type="tel"
                                                                                   inputmode="tel" autocomplete="tel"
                                                                                   pattern="(?:\+7|8)? ?(?:\([0-9]{3}\)|[0-9]{3}) ?[0-9]{3}(?: |-)?[0-9]{2}(?: |-)?[0-9]{2}"
                                                                                   title="Введите 10 цифр или номер с +7/8, например +7 967 942-52-67" required></div>
            <div class="form-field"><label for="order-comment">Комментарий</label><textarea id="order-comment"
                                                                                            rows="4"></textarea></div>
            <div class="form-field form-field--checkbox">
                <label><input type="checkbox" required> Подтверждаю правильность указанных данных</label>
            </div>
            <div class="form-actions">
                <button class="button" type="submit">Завершить заявку</button>
            </div>
        </form>
        <p id="order-message" class="success-message" role="status" tabindex="-1" hidden></p></section>
